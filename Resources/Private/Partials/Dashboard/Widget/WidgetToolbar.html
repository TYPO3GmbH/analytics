<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="tx-analytics-{prefix}-header">
    <f:if condition="{showSiteSelect}">
        <div class="tx-analytics-{prefix}-toolbar">
            <label class="form-label tx-analytics-{prefix}-site-label" for="{siteSelectId}">{siteLabel}</label>
            <select id="{siteSelectId}" class="form-select form-select-sm tx-analytics-{prefix}-site-select">
                <f:for each="{siteOptions}" as="siteOption">
                    <f:if condition="{siteOption.selected}">
                        <f:then>
                            <option value="{siteOption.value}" selected="selected">{siteOption.label}</option>
                        </f:then>
                        <f:else>
                            <option value="{siteOption.value}">{siteOption.label}</option>
                        </f:else>
                    </f:if>
                </f:for>
            </select>
        </div>
    </f:if>
    <div class="tx-analytics-{prefix}-toolbar">
        <label class="form-label tx-analytics-{prefix}-period-label" for="{periodSelectId}">{periodLabel}</label>
        <select id="{periodSelectId}" class="form-select form-select-sm tx-analytics-{prefix}-period-select">
            <f:for each="{periodOptions}" as="periodOption">
                <f:if condition="{periodOption.selected}">
                    <f:then>
                        <option value="{periodOption.value}" selected="selected">{periodOption.label}</option>
                    </f:then>
                    <f:else>
                        <option value="{periodOption.value}">{periodOption.label}</option>
                    </f:else>
                </f:if>
            </f:for>
        </select>
    </div>
</div>
</html>
