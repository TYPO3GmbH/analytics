<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="tx-analytics-traffic-graph-chart-wrap">
    <div class="tx-analytics-traffic-graph-y-axis" aria-hidden="true">
        <f:for each="{chart.yLabels}" as="label">
            <span class="tx-analytics-traffic-graph-y-label">{label.label}</span>
        </f:for>
    </div>
    <div class="tx-analytics-traffic-graph-chart-area">
        <f:format.raw>{chart.sparkline}</f:format.raw>
    </div>
    <div class="tx-analytics-traffic-graph-x-axis" aria-hidden="true">
        <f:for each="{chart.xLabels}" as="label">
            <span>{label}</span>
        </f:for>
    </div>
</div>
<f:if condition="{chart.legend -> f:count()} > 1">
    <div class="tx-analytics-traffic-graph-legend" aria-hidden="true">
        <f:for each="{chart.legend}" as="item">
            <span class="tx-analytics-traffic-graph-legend-item" data-tone="{item.tone}">{item.label}</span>
        </f:for>
    </div>
</f:if>
</html>
