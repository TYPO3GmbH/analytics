<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Widget/Widget" />
<f:section name="main">

    <div class="tx-analytics-traffic-graph">
        <f:render partial="Dashboard/Widget/TrafficGraphChart" arguments="{chart: chart}" />
        <f:if condition="{chart.legend -> f:count()} > 1">
            <div class="tx-analytics-traffic-graph-legend" aria-hidden="true">
                <f:for each="{chart.legend}" as="item">
                    <span class="tx-analytics-traffic-graph-legend-item" data-tone="{item.tone}">{item.label}</span>
                </f:for>
            </div>
        </f:if>
    </div>

</f:section>
<f:section name="footer">
    <f:if condition="{showAllUrl}">
        <a class="widget-cta" href="{showAllUrl}" aria-label="{showAllLabel}">
            {showAllLabel}
        </a>
    </f:if>
</f:section>
</html>
