<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{noData}">
    <f:then>
        <f:render partial="Dashboard/Widget/NoDataAlert" arguments="{periodLabel: currentPeriodLabel}" />
    </f:then>
    <f:else>
        <f:render partial="Dashboard/Widget/SitePerformanceMetrics" arguments="{metrics: metrics}" />
    </f:else>
</f:if>
</html>
