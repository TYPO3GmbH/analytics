<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Widget/Widget" />
<f:section name="main">

    <div class="tx-analytics-site-performance" data-site="{siteIdentifier}" data-days="{selectedDays}">
        <f:render partial="Dashboard/Widget/WidgetToolbar" arguments="{prefix: 'site-performance', showSiteSelect: showSiteSelect, siteSelectId: siteSelectId, siteLabel: siteLabel, siteOptions: siteOptions, periodSelectId: periodSelectId, periodLabel: periodLabel, periodOptions: periodOptions}" />

        <div class="tx-analytics-site-performance-metrics-container">
            <f:render partial="Dashboard/Widget/SitePerformanceMetrics" arguments="{metrics: metrics}" />
        </div>
    </div>

</f:section>
<f:section name="footer">
    <f:if condition="{showAllUrl}">
        <a class="widget-cta" href="{showAllUrl}" aria-label="{showAllLabel}">
            {showAllLabel}
        </a>
    </f:if>
</f:section>
</html>
