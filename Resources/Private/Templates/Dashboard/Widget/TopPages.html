<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Widget/Widget" />
<f:section name="main">

    <div class="tx-analytics-top-pages" data-site="{siteIdentifier}">
        <div class="tx-analytics-top-pages-header">
            <f:if condition="{showSiteSelect}">
                <div class="tx-analytics-top-pages-toolbar">
                    <label class="form-label tx-analytics-top-pages-site-label" for="{siteSelectId}">{siteLabel}</label>
                    <select id="{siteSelectId}" class="form-select form-select-sm tx-analytics-top-pages-site-select">
                        <f:for each="{siteOptions}" as="siteOption">
                            <f:if condition="{siteOption.selected}">
                                <f:then>
                                    <option value="{siteOption.value}" selected="selected">{siteOption.label}</option>
                                </f:then>
                                <f:else>
                                    <option value="{siteOption.value}">{siteOption.label}</option>
                                </f:else>
                            </f:if>
                        </f:for>
                    </select>
                </div>
            </f:if>
            <div class="tx-analytics-top-pages-actions">
                <a class="tx-analytics-top-pages-link" href="#" aria-label="{showAllLabel}">
                    <span>{showAllLabel}</span>
                    <span class="tx-analytics-top-pages-icon tx-analytics-top-pages-icon-arrow-up-right" aria-hidden="true"></span>
                </a>
            </div>
        </div>

        <ol class="tx-analytics-top-pages-list">
            <f:for each="{pages}" as="page">
                <li class="tx-analytics-top-pages-row">
                    <span class="tx-analytics-top-pages-position">{page.position}</span>
                    <a class="tx-analytics-top-pages-title" href="{page.url}" title="{page.title}" target="_blank" rel="noreferrer">{page.title}</a>
                    <typo3-backend-progress-bar class="tx-analytics-top-pages-bar" value="{page.visitPercentOfTotal}" max="100"></typo3-backend-progress-bar>
                    <span class="tx-analytics-top-pages-count">{page.visitCount}</span>
                    <span class="tx-analytics-top-pages-trend tx-analytics-top-pages-trend-{page.trendDirection}" title="{page.trendLabel}">
                        <f:if condition="{page.trend}">
                            <f:then>
                                <span>{page.trend}</span>
                                <span class="tx-analytics-top-pages-trend-icon tx-analytics-top-pages-icon-trend-{page.trendDirection}" aria-hidden="true"></span>
                            </f:then>
                            <f:else>
                                <span class="tx-analytics-top-pages-trend-icon tx-analytics-top-pages-icon-trend-neutral" aria-hidden="true"></span>
                            </f:else>
                        </f:if>
                    </span>
                </li>
            </f:for>
        </ol>
    </div>

</f:section>
</html>
