<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Widget/Widget" />
<f:section name="main">

    <div class="tx-analytics-top-pages" data-site="{siteIdentifier}" data-days="{selectedDays}" data-tp-label-views="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:dashboardWidget.topPages.tooltip.views')}" data-tp-label-share="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:dashboardWidget.trafficSources.tooltip.share')}" data-tp-label-change="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:dashboardWidget.trafficSources.tooltip.change')}">
        <f:render partial="Dashboard/Widget/WidgetToolbar" arguments="{prefix: 'top-pages', showSiteSelect: showSiteSelect, siteSelectId: siteSelectId, siteLabel: siteLabel, siteOptions: siteOptions, periodSelectId: periodSelectId, periodLabel: periodLabel, periodOptions: periodOptions}" />

        <div class="tx-analytics-top-pages-list-container">
            <f:if condition="{noData}">
                <f:then>
                    <f:render partial="Dashboard/Widget/NoDataAlert" arguments="{periodLabel: currentPeriodLabel}" />
                </f:then>
                <f:else>
                    <f:render partial="Dashboard/Widget/TopPagesList" arguments="{pages: pages}" />
                </f:else>
            </f:if>
        </div>
    </div>

</f:section>
<f:section name="footer">
    <f:if condition="{showAllUrl}">
        <a class="widget-cta" href="{showAllUrl}" aria-label="{showAllLabel}">
            {showAllLabel}
        </a>
    </f:if>
</f:section>
</html>
