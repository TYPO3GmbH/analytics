<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Widget/Widget" />
<f:section name="main">

    <f:if condition="{noData}">
        <f:then>
            <f:render partial="Dashboard/Widget/NoDataAlert" arguments="{periodLabel: periodLabel}" />
        </f:then>
        <f:else>
            <div class="tx-analytics-top-pages" data-tp-label-views="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:dashboardWidget.topPages.tooltip.views')}" data-tp-label-share="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:dashboardWidget.trafficSources.tooltip.share')}" data-tp-label-change="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:dashboardWidget.trafficSources.tooltip.change')}">
                <f:render partial="Dashboard/Widget/TopPagesList" arguments="{pages: pages}" />
            </div>
        </f:else>
    </f:if>

</f:section>
<f:section name="footer">
    <f:if condition="{showAllUrl}">
        <a class="widget-cta" href="{showAllUrl}" aria-label="{showAllLabel}">
            {showAllLabel}
        </a>
    </f:if>
</f:section>
</html>
