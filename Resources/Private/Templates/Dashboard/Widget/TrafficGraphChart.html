<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<!-- Template stub required by ViewInterface::render() — actual markup lives in the partial. -->
<f:if condition="{noData}">
    <f:then>
        <f:render partial="Dashboard/Widget/NoDataAlert" arguments="{periodLabel: currentPeriodLabel}" />
    </f:then>
    <f:else>
        <f:render partial="Dashboard/Widget/TrafficGraphChart" arguments="{chart: chart}" />
    </f:else>
</f:if>
</html>
