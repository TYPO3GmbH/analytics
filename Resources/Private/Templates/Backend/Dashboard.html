{namespace core=TYPO3\CMS\Core\ViewHelpers}
<f:layout name="Default" />

<f:section name="Content">
    <div style="display:flex; flex-direction:column; height:calc(100vh - 80px);">
        <div class="module-docheader-bar" style="padding: 8px 16px; flex-shrink:0;">
            <strong>
                <core:icon identifier="apps-pagetree-root" size="small" />
                {site.pageName}
            </strong>
            <span class="text-muted"> – {site.title}</span>
        </div>
        <iframe
            src="{dashboardUrl}"
            style="flex:1; width:100%; border:none;"
            allowfullscreen="true"
        ></iframe>
    </div>
</f:section>
