<f:layout name="Default" />

<f:section name="Content">
    <style>.module-body { padding: 0; overflow: hidden; }</style>
    <iframe
        src="{dashboardUrl}"
        style="display:block; width:100%; height:100vh; border:none;"
        allowfullscreen="true"
    ></iframe>
    <script>
    (function() {
        var invalidateCacheUri = {invalidateStatusCacheUri -> f:format.json()};
        var dashboardOrigin = {dashboardOrigin -> f:format.json()};
        window.addEventListener('message', function(event) {
            if (event.origin !== dashboardOrigin) return;
            if (!event.data || event.data.type !== 'SUBSCRIPTION_UPGRADED') return;
            fetch(invalidateCacheUri, { method: 'POST' });
        });
    })();
    </script>
</f:section>
