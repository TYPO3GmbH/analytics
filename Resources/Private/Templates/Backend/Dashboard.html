<f:layout name="Module" />

<f:section name="Content">
    <f:asset.css identifier="analytics-backend" href="EXT:analytics/Resources/Public/Css/Backend.css" />

    <iframe
        src="{dashboardUrl}"
        class="tx-analytics-iframe"
        allowfullscreen="true"
    ></iframe>
    <script>
    (function() {
        var invalidateCacheUri = {invalidateStatusCacheUri -> f:format.json()};
        var dashboardOrigin = {dashboardOrigin -> f:format.json()};
        window.addEventListener('message', function(event) {
            if (event.origin !== dashboardOrigin) return;
            if (!event.data || event.data.type !== 'SUBSCRIPTION_UPGRADED') return;
            fetch(invalidateCacheUri, { method: 'POST' });
        });
    })();
    </script>
</f:section>
