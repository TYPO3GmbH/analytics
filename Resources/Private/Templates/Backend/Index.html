{namespace core=TYPO3\CMS\Core\ViewHelpers}
<f:layout name="Module" />

<f:section name="Content">
    <f:asset.css identifier="analytics-backend" href="EXT:analytics/Resources/Public/Css/Backend.css" />
    <f:asset.script identifier="analytics-module" src="EXT:analytics/Resources/Public/JavaScript/analytics-module.js" type="module" />

    <div class="module-body-container t3js-module-body-container tx-analytics-module-overview">
        <h1 class="tx-analytics-module-logo">
            <f:format.raw>{logoSvg}</f:format.raw>
        </h1>

        <div class="callout callout-notice">
            <div class="callout-icon">
                <span class="icon-emphasized">
                    <core:icon identifier="actions-lightbulb" size="small" />
                </span>
            </div>
            <div class="callout-content">
                <div class="callout-title">
                    <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.status" />
                </div>
                <div class="callout-body">
                    <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:backend.intro" />
                </div>
            </div>
        </div>

        <f:for each="{siteGroups}" as="siteGroup">
            <section class="tx-analytics-site-group">
                <h2 class="tx-analytics-site-group-title">{siteGroup.title}</h2>
                <div class="card-container tx-analytics-site-card-container">
                    <f:for each="{siteGroup.sites}" as="site">
                        <f:render partial="Backend/SiteCard" arguments="{site: site, isManager: isManager, registerUri: registerUri, statusUri: statusUri}" />
                    </f:for>
                </div>
            </section>
        </f:for>
    </div>
</f:section>
