{namespace core=TYPO3\CMS\Core\ViewHelpers}
<f:layout name="Module" />

<f:section name="Content">
    <f:asset.css identifier="analytics-backend" href="EXT:analytics/Resources/Public/Css/Backend.css" />
    <f:asset.script identifier="analytics-module" src="EXT:analytics/Resources/Public/JavaScript/analytics-module.js" type="module" />

    <div class="module-body-container t3js-module-body-container tx-analytics-module-overview">
        <h1 class="tx-analytics-module-logo">
            <f:format.raw>{logoSvg}</f:format.raw>
        </h1>

        <div class="callout callout-notice">
            <div class="callout-icon">
                <span class="icon-emphasized">
                    <core:icon identifier="actions-lightbulb" size="small" />
                </span>
            </div>
            <div class="callout-content">
                <div class="callout-title">
                    <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.status" />
                </div>
                <div class="callout-body">
                    <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:backend.intro" />
                </div>
            </div>
        </div>

        <f:if condition="{plansUrl}">
            <section class="tx-analytics-site-group" id="tx-analytics-plans-section">
                <div id="tx-analytics-plans-root"
                     data-plans-url="{plansUrl}"
                     data-i18n-heading="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.heading')}"
                     data-i18n-toggle-monthly="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.monthly')}"
                     data-i18n-toggle-yearly="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.yearlyToggle')}"
                     data-i18n-free="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.free')}"
                     data-i18n-trial-note="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.trialLimited')}"
                     data-i18n-credits="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.touchpointsPerMonth')}"
                     data-i18n-api-access="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.apiAccess')}"
                     data-i18n-dashboards="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.ownDashboards')}"
                     data-i18n-per-month="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.perMonth')}"
                     data-i18n-per-year="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.perYear')}"
                     data-i18n-badge-trial="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:badge.trial')}"
                     data-i18n-custom-name="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.custom.name')}"
                     data-i18n-custom-tagline="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.custom.tagline')}"
                     data-i18n-custom-contact="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.custom.contact')}"
                     data-i18n-custom-email-subject="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.custom.emailSubject')}"
                     data-i18n-custom-credits="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.plans.custom.credits')}"
                ></div>
            </section>
        </f:if>

        <f:for each="{siteGroups}" as="siteGroup">
            <f:if condition="{siteGroup.sites}">
                <section class="tx-analytics-site-group">
                    <h2 class="tx-analytics-site-group-title">{siteGroup.title}</h2>
                    <div class="card-container tx-analytics-site-card-container">
                        <f:for each="{siteGroup.sites}" as="site">
                            <f:render partial="Backend/SiteCard" arguments="{site: site, isManager: isManager, registerUri: registerUri, statusUri: statusUri}" />
                        </f:for>
                    </div>
                </section>
            </f:if>
        </f:for>
    </div>
</f:section>
