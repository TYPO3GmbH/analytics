{namespace core=TYPO3\CMS\Core\ViewHelpers}
<f:layout name="Module" />

<f:section name="Content">
    <f:asset.css identifier="analytics-backend" href="EXT:analytics/Resources/Public/Css/Backend.css" />
    <f:asset.script identifier="analytics-module" src="EXT:analytics/Resources/Public/JavaScript/analytics-module.js" type="module" />

    <div class="module-body-container t3js-module-body-container tx-analytics-module-overview">
        <h1 class="tx-analytics-module-logo">
            <f:format.raw>{logoSvg}</f:format.raw>
        </h1>

        <div class="callout callout-notice">
            <div class="callout-icon">
                <span class="icon-emphasized">
                    <core:icon identifier="actions-lightbulb" size="small" />
                </span>
            </div>
            <div class="callout-content">
                <div class="callout-title">
                    <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.status" />
                </div>
                <div class="callout-body">
                    <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:backend.intro" />
                </div>
            </div>
        </div>

        <f:render partial="Backend/Plans" arguments="{plansUrl: plansUrl}" />

        <f:for each="{siteGroups}" as="siteGroup">
            <f:if condition="{siteGroup.sites}">
                <f:variable name="groupContentId" value="tx-analytics-site-group-{siteGroup.id}" />
                <section class="tx-analytics-site-group">
                    <h2 class="tx-analytics-site-group-title">
                        <button
                            type="button"
                            class="tx-analytics-collapse-toggle t3js-analytics-collapse"
                            aria-expanded="{f:if(condition: siteGroup.collapsed, then: 'false', else: 'true')}"
                            aria-controls="{groupContentId}"
                        >
                            <span class="tx-analytics-collapse-icon" aria-hidden="true"></span>
                            {siteGroup.title}
                            <span class="badge badge-default">{siteGroup.sites -> f:count()}</span>
                        </button>
                    </h2>
                    <div id="{groupContentId}" class="table-fit tx-analytics-site-table" {f:if(condition: siteGroup.collapsed, then: 'hidden')}>
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.site" /></th>
                                    <th><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.domain" /></th>
                                    <th><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.status" /></th>
                                    <th><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.touchpoints" /></th>
                                    <th class="text-end">
                                        <span class="visually-hidden"><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.actions" /></span>
                                    </th>
                                </tr>
                            </thead>
                            <f:for each="{siteGroup.sites}" as="site">
                                <f:render partial="Backend/SiteRow" arguments="{site: site, isManager: isManager, registerUri: registerUri, statusUri: statusUri}" />
                            </f:for>
                        </table>
                    </div>
                </section>
            </f:if>
        </f:for>
    </div>
</f:section>
