{namespace core=TYPO3\CMS\Core\ViewHelpers}
<f:layout name="Module" />

<f:section name="Content">
    <f:asset.css identifier="analytics-backend" href="EXT:analytics/Resources/Public/Css/Backend.css" />

    <div class="module-body-container">
        <h1>
            <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:backend.headline" />
        </h1>
        <p>
            <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:backend.intro" />
        </p>
        <f:for each="{sites}" as="site">
            <div class="panel {site.panelClass}">
                <h3 class="panel-heading">
                    <div class="panel-heading-row flex-wrap">
                        <f:if condition="{site.status.status}">
                            <f:then>
                                <f:variable name="analyticsStatus" value="{site.status.status}" />
                            </f:then>
                            <f:else>
                                <f:variable name="analyticsStatus" value="" />
                            </f:else>
                        </f:if>
                        <div class="panel-title">
                            <div class="fw-bold pb-2">
                                <core:icon identifier="apps-pagetree-page-domain" size="small" />
                                {site.pageName}
                            </div>
                            <div class="pb-1">
                                <strong><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.siteTitle" />:</strong>
                                {site.title}
                            </div>
                            <div class="pb-1">
                                <strong><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.status" />:</strong>
                                <f:if condition="{site.registered}">
                                    <f:then>
                                        <f:if condition="{analyticsStatus}">
                                            <f:then>
                                                <f:if condition="{analyticsStatus} == 'active'">
                                                    <f:then><span class="badge badge-success">{analyticsStatus}</span></f:then>
                                                    <f:else>
                                                        <f:if condition="{analyticsStatus} == 'pending'">
                                                            <f:then><span class="badge badge-warning">{analyticsStatus}</span></f:then>
                                                            <f:else><span class="badge badge-danger">{analyticsStatus}</span></f:else>
                                                        </f:if>
                                                    </f:else>
                                                </f:if>
                                            </f:then>
                                            <f:else>
                                                <span class="badge badge-success">
                                                    <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:badge.registered" />
                                                </span>
                                            </f:else>
                                        </f:if>
                                    </f:then>
                                    <f:else>
                                        <span class="badge badge-warning">
                                            <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:badge.notRegistered" />
                                        </span>
                                    </f:else>
                                </f:if>
                            </div>
                            <div class="pb-1">
                                <strong><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.domain" />:</strong>
                                {site.domain}
                            </div>
                        </div>
                        <f:if condition="{site.registered}">
                            <f:then>
                                <div class="panel-actions flex-shrink-1">
                                    <a href="{site.dashboardUri}" class="btn btn-primary">
                                        <core:icon identifier="actions-view" size="small" />
                                        <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:button.dashboard" />
                                    </a>
                                    <f:if condition="{site.status.status} == 'active'">
                                        <f:then>
                                            <a href="{site.managePlanUri}" class="btn btn-default">
                                                <core:icon identifier="actions-credit-card" size="small" />
                                                <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:button.managePlan" />
                                            </a>
                                        </f:then>
                                        <f:else>
                                            <a href="{site.managePlanUri}" class="btn btn-primary">
                                                <core:icon identifier="actions-credit-card" size="small" />
                                                <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:button.subscribePlan" />
                                            </a>
                                        </f:else>
                                    </f:if>
                                    <form method="post" action="{statusUri}">
                                        <input type="hidden" name="siteIdentifier" value="{site.identifier}" />
                                        <button type="submit" class="btn btn-default">
                                            <core:icon identifier="actions-refresh" size="small" />
                                            <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:button.refreshStatus" />
                                        </button>
                                    </form>
                                </div>
                            </f:then>
                            <f:else>
                                <div class="panel-actions flex-shrink-1">
                                    <form method="post" action="{registerUri}" class="tx-analytics-registration-form w-100">
                                        <input type="hidden" name="siteIdentifier" value="{site.identifier}" />
                                        <div class="input-group">
                                            <input
                                                type="email"
                                                name="email"
                                                class="form-control"
                                                placeholder="{f:translate(key: 'LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:placeholder.registrationEmail')}"
                                                required
                                            />
                                            <button type="submit" class="btn btn-primary">
                                                <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:button.register" />
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </f:else>
                        </f:if>
                    </div>
                </h3>
                <f:if condition="{site.registered}">
                    <div class="panel-body">
                        <div>
                            <strong><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.websiteId" />:</strong>
                            <code>{site.websiteId}</code>
                        </div>
                        <f:if condition="{site.status}">
                            <f:if condition="{site.status.packageName}">
                                <div>
                                    <strong><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.package" />:</strong>
                                    {site.status.packageName}
                                </div>
                            </f:if>
                            <f:if condition="{site.status.expiresAt}">
                                <div>
                                    <strong><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.validUntil" />:</strong>
                                    <f:format.date format="d.m.Y" date="{site.status.expiresAt}" />
                                </div>
                            </f:if>
                            <f:if condition="{site.status.consumption.limited}">
                                <div>
                                    <strong><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.touchpoints" />:</strong>
                                    {site.status.consumption.stpConsumed} / {site.status.consumption.stpLimit}
                                    <f:if condition="{site.status.stpResetAt}">
                                        <span class="text-muted">
                                            (<f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.resetsAt" />:
                                            <f:format.date format="d.m.Y" date="{site.status.stpResetAt}" />)
                                        </span>
                                    </f:if>
                                    <f:if condition="{site.status.consumption.exhausted}">
                                        <span class="badge badge-danger">
                                            <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:badge.exhausted" />
                                        </span>
                                    </f:if>
                                    <f:if condition="{site.status.consumption.warning}">
                                        <span class="badge badge-warning">
                                            <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:badge.lowCredits" />
                                        </span>
                                    </f:if>
                                </div>
                                <f:if condition="{site.status.consumption.exhausted}">
                                    <div class="alert alert-danger mt-2">
                                        <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:message.touchpointsExhausted" />
                                        <a href="{site.managePlanUri}" class="alert-link">
                                            <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:button.managePlan" />
                                        </a>.
                                    </div>
                                </f:if>
                                <f:if condition="{site.status.consumption.warning}">
                                    <div class="alert alert-warning mt-2">
                                        <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:message.touchpointsLow" />
                                        <a href="{site.managePlanUri}" class="alert-link">
                                            <f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:button.managePlan" />
                                        </a>.
                                    </div>
                                </f:if>
                            </f:if>
                            <f:if condition="{site.status._fetchedAt}">
                                <div class="text-muted small">
                                    <strong><f:translate key="LLL:EXT:analytics/Resources/Private/Language/locallang.xlf:label.updatedAt" />:</strong>
                                    <f:format.date format="d.m.Y H:i" date="{site.status._fetchedAt}" />
                                </div>
                            </f:if>
                        </f:if>
                    </div>
                </f:if>
            </div>
        </f:for>
    </div>
</f:section>
